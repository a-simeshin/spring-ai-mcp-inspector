name: CI

# Build + test gate for main and the development branches. release.yml deploys
# with `-DskipTests`, so this workflow is the only place tests run at all.
#
# Two jobs, because the demo module's Selenide/Selenium browser suite takes
# 20-56 min while the rest of the reactor finishes in ~4 (parent 1s, core 23s,
# ui 20s, starter-webmvc 2min, starter-webflux 30s):
#   * `build` — fast, runs on every PR, meant to be the required check.
#   * `e2e`   — slow, full reactor incl. demo. Post-merge on the long-lived
#               branches, on demand, or on a PR labelled `e2e`. Never the thing
#               a routine PR waits on.
#
# `push` is deliberately scoped to main + develop/**: a topic-branch PR then
# triggers each job exactly once (no push/pull_request double billing), and the
# post-merge push run is the full-suite pass.

on:
  push:
    branches:
      - main
      - 'develop/**'
  pull_request:
    branches:
      - main
      - 'develop/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build + test (JDK 17)
    runs-on: ubuntu-latest
    # ~4 min of work; anything past 30 is a hang, not a slow runner.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Unit + integration tests and the quality gates (spring-javaformat,
      # checkstyle, SpotBugs, JaCoCo coverage). The demo module is excluded —
      # its browser E2E runs in the `e2e` job below.
      - name: Build, test and gates
        run: ./mvnw -B -ntp verify -pl '!:spring-ai-mcp-inspector-demo'

  e2e:
    name: demo E2E (JDK 17)
    runs-on: ubuntu-latest
    # Measured 20-56 min for the demo module; the cap stops a wedged browser or
    # a hung proxy session from burning the 6h GitHub default.
    timeout-minutes: 90
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Selenide UI integration tests (InspectorUiIT, UiBigDataIT) drive a real
      # browser via WebDriverManager; provide one.
      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test the full reactor
        run: ./mvnw -B -ntp verify
