name: CI

# Build + test gate for main and the development branches. release.yml deploys
# with `-DskipTests`, so this workflow is the only place tests run at all.
#
# Two jobs, because the demo module needs a browser and the rest of the reactor
# does not:
#   * `build` — reactor minus demo, ~3.5 min. The required check.
#   * `e2e`   — full reactor incl. the demo Selenide suite, ~7 min. Runs on
#               every PR too: this module is where the real breakages hide, and
#               since 5af9c56 (no 30s graceful-shutdown wait per context) it is
#               cheap enough not to need a gate.
#
# `push` is deliberately scoped to main + develop/**: a topic-branch PR then
# triggers each job exactly once (no push/pull_request double billing), and the
# post-merge push run is the full-suite pass.

on:
  push:
    branches:
      - main
      - 'develop/**'
  pull_request:
    branches:
      - main
      - 'develop/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build + test (JDK 17)
    runs-on: ubuntu-latest
    # ~4 min of work; anything past 30 is a hang, not a slow runner.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Unit + integration tests and the quality gates (spring-javaformat,
      # checkstyle, SpotBugs, JaCoCo coverage). The demo module is excluded —
      # its browser E2E runs in the `e2e` job below.
      - name: Build, test and gates
        run: ./mvnw -B -ntp verify -pl '!:spring-ai-mcp-inspector-demo'

  e2e:
    name: demo E2E (JDK 17)
    runs-on: ubuntu-latest
    # ~7 min measured; the cap stops a wedged browser or a hung proxy session
    # from burning the 6h GitHub default.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Selenide UI integration tests (InspectorUiIT, UiBigDataIT) drive a real
      # browser via WebDriverManager; provide one.
      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test the full reactor
        run: ./mvnw -B -ntp verify
